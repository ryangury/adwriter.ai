{% extends "layout.html" %}
{% block title %}Ad Writer — Mercedes-Benz of Durham{% endblock %}
{% block head %}
<style>
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 64px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }
  header h1 {
    font-size: 1.4rem;
    font-weight: 650;
    margin: 0 0 4px;
    color: var(--accent);
  }
  header p {
    margin: 0 0 24px;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .signout {
    flex: none;
    font-size: 0.85rem;
    color: var(--muted);
    text-decoration: none;
    border: 1px solid var(--line);
    padding: 5px 12px;
    border-radius: 8px;
    white-space: nowrap;
  }
  .signout:hover { color: var(--text); }
  form {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
    background: var(--card);
  }
  label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .field { flex: 1 1 220px; }
  input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    font-size: 1rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--text);
  }
  input[type="text"]:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  button {
    align-self: flex-end;
    padding: 10px 22px;
    font-size: 1rem;
    font-weight: 600;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button:disabled { opacity: 0.55; cursor: default; }

  .btn-row { display: flex; gap: 10px; align-self: flex-end; }

  .lookup-badge { margin-top: 8px; min-height: 22px; }
  .badge-onfile {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.78rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
    background: var(--ok);
    color: #fff;
  }

  #results { margin-top: 28px; }
  #results:empty { display: none; }

  .loading {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
    font-weight: 600;
  }
  .spinner {
    width: 20px; height: 20px;
    border: 3px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    flex: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  ul.steps { list-style: none; margin: 0 0 22px; padding: 0; }
  ul.steps li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0;
    font-size: 0.92rem;
    color: var(--muted);
  }
  ul.steps li .dot {
    width: 16px; height: 16px; flex: none;
    border-radius: 50%;
    border: 2px solid var(--line);
  }
  ul.steps li.active { color: var(--text); }
  ul.steps li.active .dot { border-color: var(--accent); border-top-color: transparent; animation: spin 0.8s linear infinite; }
  ul.steps li.ok { color: var(--text); }
  ul.steps li.ok .dot { background: var(--ok); border-color: var(--ok); }
  ul.steps li.fail { color: var(--text); }
  ul.steps li.fail .dot { background: var(--fail); border-color: var(--fail); }

  .section {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
    background: var(--card);
  }
  .section h2 {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin: 0 0 10px;
  }
  .kv { display: grid; grid-template-columns: 120px 1fr; gap: 4px 12px; font-size: 0.95rem; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; }

  .badges { display: flex; flex-wrap: wrap; gap: 8px; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid transparent;
    color: #fff;
  }
  .badge .glyph { font-size: 0.95rem; line-height: 1; }
  .badge.success { background: var(--ok); border-color: var(--ok); }
  .badge.warning { background: #b45309; border-color: #b45309; }
  .badge.failed  { background: var(--fail); border-color: var(--fail); }
  .badge.cache-yes { background: var(--ok); border-color: var(--ok); }
  .badge.cache-no  { background: #9ca3af; border-color: #9ca3af; }
  .badge .cache-tag {
    font-size: 0.72rem;
    font-weight: 600;
    padding: 2px 7px;
    margin-left: 2px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.28);
  }

  .adwrap { position: relative; }
  .fb-body { position: relative; }
  .adwrap pre, .fb pre {
    white-space: pre-wrap;
    word-wrap: break-word;
    font-family: inherit;
    font-size: 0.97rem;
    margin: 0;
  }
  .fb pre {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .copy-btn {
    position: absolute;
    top: 0; right: 0;
    padding: 5px 12px;
    font-size: 0.8rem;
    background: #fff;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 6px;
  }
  .section h2.with-btn { padding-right: 84px; }

  .link-toggle {
    align-self: auto;
    background: none;
    border: none;
    padding: 0;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--accent);
    text-decoration: underline;
    cursor: pointer;
  }
  .fb-body { margin-top: 10px; padding-top: 32px; }

  .error-box {
    border: 1px solid var(--fail);
    background: #fef2f2;
    color: var(--fail);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 16px;
    font-weight: 500;
  }
  .pill {
    display: inline-block;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
    background: #eef2f7;
    color: var(--accent);
  }

  .save-discard { display: flex; align-items: center; gap: 10px; }
  .btn-save {
    background: var(--ok);
    padding: 11px 24px;
    font-size: 1rem;
    font-weight: 700;
  }
  .btn-discard {
    align-self: auto;
    background: #fff;
    color: var(--muted);
    border: 1px solid var(--line);
    padding: 7px 16px;
    font-size: 0.85rem;
    font-weight: 600;
  }
  .save-msg { font-weight: 600; padding: 6px 0; }
  .save-msg.save-ok { color: var(--ok); }
  .save-msg.save-fail { color: var(--fail); }
  .save-msg.save-discarded { color: var(--muted); }


  @media (max-width: 480px) {
    button { align-self: stretch; width: 100%; }
    .kv { grid-template-columns: 1fr; }
    .kv dt { margin-top: 6px; }
  }
</style>
{% endblock %}
{% block content %}
<div class="wrap">
  <header>
    <div>
      <h1>Mercedes-Benz of Durham Ad Writer</h1>
      <p>Enter a stock number to run the pipeline and draft an ad.</p>
    </div>
  </header>

  <form id="gen-form" autocomplete="off">
    <div class="field">
      <label for="stock_number">Stock number</label>
      <input type="text" id="stock_number" name="stock_number" placeholder="e.g. PM10954" required>
      <div class="lookup-badge" id="lookup-badge"></div>
    </div>
    <div class="btn-row">
      <button type="submit" id="submit-btn">Generate New Ad</button>
    </div>
  </form>

  <div id="results"></div>
</div>
{% endblock %}
{% block scripts %}
<script>
(function () {
  "use strict";

  // Shared card renderers — one copy, in static/cards.js (also used by the
  // Inventory detail page).
  var esc = Cards.esc, fmtMiles = Cards.fmtMiles, fmtPrice = Cards.fmtPrice, fmtNum = Cards.fmtNum,
      daysChip = Cards.daysChip, cardRecon = Cards.cardRecon, cardCarfax = Cards.cardCarfax,
      cardProofPoints = Cards.cardProofPoints, cardMarketData = Cards.cardMarketData;

  var form = document.getElementById("gen-form");
  var input = document.getElementById("stock_number");
  var btn = document.getElementById("submit-btn");
  var badgeEl = document.getElementById("lookup-badge");
  var results = document.getElementById("results");

  var STEPS = [
    { key: "acvmax",     label: "ACV MAX pricing" },
    { key: "autoipacket", label: "AutoiPacket window sticker" },
    { key: "reconvision", label: "ReconVision recon" },
    { key: "carfax",     label: "Carfax history" },
    { key: "adcopy",     label: "Writing ad copy" }
  ];

  var walkTimer = null;


  function renderLoading() {
    var lis = STEPS.map(function (s) {
      return '<li data-step="' + s.key + '"><span class="dot"></span>' + esc(s.label) + "</li>";
    }).join("");
    results.innerHTML =
      '<div class="loading"><span class="spinner"></span><span id="load-msg">Running the pipeline…</span></div>' +
      '<ul class="steps">' + lis + "</ul>";
  }

  function stepEl(key) {
    return results.querySelector('li[data-step="' + key + '"]');
  }

  // While we wait on the single blocking request, walk the "active" highlight
  // down the scraper steps so the user sees progress. Real success/failed
  // state is applied from the response when it lands.
  function startWalk() {
    var i = 0;
    var order = ["acvmax", "autoipacket", "reconvision", "carfax", "adcopy"];
    function tick() {
      order.forEach(function (k, idx) {
        var el = stepEl(k);
        if (!el) return;
        el.classList.toggle("active", idx === i);
      });
      var msgEl = document.getElementById("load-msg");
      if (msgEl && STEPS[i]) msgEl.textContent = STEPS[i].label + "…";
      i = Math.min(i + 1, order.length - 1);
    }
    tick();
    walkTimer = setInterval(tick, 1400);
  }

  function stopWalk() {
    if (walkTimer) { clearInterval(walkTimer); walkTimer = null; }
  }

  function applyScraperSteps(scraper) {
    scraper = scraper || {};
    ["acvmax", "autoipacket", "reconvision", "carfax"].forEach(function (k) {
      var el = stepEl(k);
      if (!el) return;
      el.classList.remove("active");
      el.classList.add(scraper[k] === "success" || scraper[k] === "warning" ? "ok" : "fail");
    });
  }

  function finishAdStep(ok) {
    var el = stepEl("adcopy");
    if (!el) return;
    el.classList.remove("active");
    el.classList.add(ok ? "ok" : "fail");
  }

  // -------------------------------------------------------------------- //
  // Quick-glance dashboard — four compact cards shown at the top of the
  // results area right after a successful Generate New Ad.
  // -------------------------------------------------------------------- //


  function sectionDashboard(data) {
    if (!data || !data.recon_included) return "";
    var cards = cardRecon(data.recon_included, data.recon_excluded) +
      cardCarfax(data.carfax_detail) +
      Cards.cardSticker(data.sticker) +
      cardProofPoints(data.proof_points_all) +
      cardMarketData(data.market_data) +
      cardVehicle(data.vehicle);
    return '<div class="dashboard">' + cards + "</div>";
  }

  // Compact vehicle tile — last cell of the dashboard grid, beside Market data.
  function cardVehicle(v) {
    if (!v) return "";
    var name = [v.year, v.make, v.model].filter(Boolean).join(" ") ||
      v.year_make_model || "—";
    return '<div class="dcard vehicle-card"><h3>Vehicle</h3>' +
      '<div class="vehicle-name">' + esc(name) + "</div>" +
      '<div class="dline"><span class="dtext">' + esc(fmtMiles(v.mileage)) +
        " &middot; " + esc(fmtPrice(v.price)) + "</span></div>" +
      (v.vin ? '<div class="vehicle-vin">' + esc(v.vin) + "</div>" : "") +
      "</div>";
  }

  // Without dashboard data (e.g. an error before aggregation) the vehicle
  // still shows, as a standalone tile.
  function sectionVehicle(data) {
    if (!data.vehicle || data.recon_included) return "";
    return '<div class="dashboard">' + cardVehicle(data.vehicle) + "</div>";
  }

  // Real scraper status straight from the API response's scraper_status object:
  // one green ✓ / red ✗ badge per source, replacing the animated step list.
  var SCRAPER_LABELS = [
    ["acvmax", "ACV MAX"],
    ["autoipacket", "AutoiPacket"],
    ["reconvision", "ReconVision"],
    ["carfax", "Carfax"]
  ];

  // scraper_status source -> the vehicle_cache.db field its cache_status
  // covers. No entry for acvmax: it's never cached.
  var CACHE_KEY_MAP = {
    autoipacket: "window_sticker",
    carfax: "carfax",
    reconvision: "recon"
  };

  function sectionScrapers(scraper, cacheStatus) {
    if (!scraper) return "";
    cacheStatus = cacheStatus || {};
    var badges = SCRAPER_LABELS.map(function (pair) {
      // "success" (usable), "warning" (ran but degraded: approximate MSRP,
      // no owner count), anything else (error / unavailable / empty) is failed.
      var state = scraper[pair[0]];
      var cls = state === "success" ? "success" : state === "warning" ? "warning" : "failed";
      var glyph = cls === "success" ? "✓" : cls === "warning" ? "!" : "✗";   // ✓ / ! / ✗
      var cacheKey = CACHE_KEY_MAP[pair[0]];
      var cacheState = cacheKey ? cacheStatus[cacheKey] : null;
      var cacheTag = "";
      if (cacheState === "cached" || cacheState === "already_cached") {
        var title = cacheState === "cached"
          ? "Newly cached to vehicle_cache.db this run"
          : "Already in vehicle_cache.db";
        cacheTag = '<span class="cache-tag" title="' + esc(title) + '">Cached</span>';
      }
      return '<span class="badge ' + cls + '">' +
             '<span class="glyph">' + glyph + "</span>" + esc(pair[1]) + cacheTag + "</span>";
    }).join("");
    return '<div class="section"><h2>Scraper status</h2><div class="badges">' + badges + "</div></div>";
  }

  function sectionMeta(data) {
    var rows = "";
    if (data.peacock_mode != null) {
      rows += "<dt>Peacock mode</dt><dd>" + (data.peacock_mode ? "true" : "false") + "</dd>";
    }
    if (data.proof_point) {
      rows += "<dt>Proof point</dt><dd>" + esc(data.proof_point) + "</dd>";
    }
    if (!rows) return "";
    return '<div class="section"><h2>Pipeline notes</h2><dl class="kv">' + rows + "</dl></div>";
  }

  function sectionAd(text) {
    if (!text) return "";
    return '<div class="section adwrap">' +
      '<h2 class="with-btn">Ad copy</h2>' +
      '<button type="button" class="copy-btn" id="copy-ad">Copy</button>' +
      "<pre id=\"ad-text\">" + esc(text) + "</pre></div>";
  }

  // Save Ad to System / Discard — only after a successful fresh generation
  // (data.ad_copy present). The Save button carries everything /save needs
  // as data-* attributes so the click handler has no other state to track.
  function sectionSaveDiscard(data) {
    if (!data || !data.ad_copy) return "";
    var v = data.vehicle || {};
    var ymm = v.year_make_model ||
      [v.year, v.make, v.model].filter(Boolean).join(" ") || "";
    return '<div class="section save-discard" id="save-discard-section">' +
      '<button type="button" id="save-ad-btn" class="btn-save" ' +
        'data-stock="' + esc(data.stock_number || "") + '" ' +
        'data-ad-copy="' + esc(data.ad_copy) + '" ' +
        'data-price="' + esc(v.price != null ? v.price : "") + '" ' +
        'data-ymm="' + esc(ymm) + '" ' +
        'data-lifecycle="' + esc(data.lifecycle_stage || "active") + '">' +
        "Save Ad to System</button>" +
      '<button type="button" id="discard-ad-btn" class="btn-discard">Discard</button>' +
      "</div>";
  }

  function wireSaveDiscard() {
    var saveBtn = document.getElementById("save-ad-btn");
    var discardBtn = document.getElementById("discard-ad-btn");
    var section = document.getElementById("save-discard-section");
    if (!saveBtn || !discardBtn || !section) return;

    saveBtn.addEventListener("click", function () {
      saveBtn.disabled = true;
      discardBtn.disabled = true;
      var payload = {
        stock_number: saveBtn.dataset.stock || "",
        ad_copy: saveBtn.dataset.adCopy || "",
        price: saveBtn.dataset.price || "",
        year_make_model: saveBtn.dataset.ymm || "",
        lifecycle_stage: saveBtn.dataset.lifecycle || "active"
      };
      fetch("/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (res) {
          if (res.ok && res.j && res.j.saved) {
            section.innerHTML = '<span class="save-msg save-ok">&#10003; Saved to system</span>';
          } else {
            var msg = (res.j && res.j.error) || "Save failed.";
            section.innerHTML = '<span class="save-msg save-fail">' + esc(msg) + "</span>";
          }
        })
        .catch(function (err) {
          section.innerHTML = '<span class="save-msg save-fail">Save failed: ' +
            esc(err && err.message ? err.message : err) + "</span>";
        });
    });

    discardBtn.addEventListener("click", function () {
      section.innerHTML = '<span class="save-msg save-discarded">Ad discarded</span>';
    });
  }

  function sectionFeedbackCollapsible(text) {
    if (!text) return "";
    return '<div class="section fb">' +
      '<button type="button" class="link-toggle" id="fb-toggle">Show AI thinking</button>' +
      '<div class="fb-body" id="fb-body" hidden>' +
      '<button type="button" class="copy-btn" id="copy-fb">Copy</button>' +
      '<pre id="fb-text">' + esc(text) + "</pre></div>" +
      "</div>";
  }

  function wireFeedbackToggle() {
    var toggle = document.getElementById("fb-toggle");
    var body = document.getElementById("fb-body");
    if (!toggle || !body) return;
    toggle.addEventListener("click", function () {
      var nowHidden = !body.hidden;
      body.hidden = nowHidden;
      toggle.textContent = nowHidden ? "Show AI thinking" : "Hide AI thinking";
    });
  }

  // Explicit normalize-and-join rather than a raw .textContent read: collapses
  // any incidental whitespace runs to exactly one blank line between
  // paragraphs, so the clipboard content can't drift from what's on screen.
  function textForCopy(el) {
    return el.textContent
      .split(/\n\s*\n/)
      .map(function (p) { return p.trim(); })
      .filter(Boolean)
      .join("\n\n");
  }

  function wireCopyButton() {
    var copyBtn = document.getElementById("copy-ad");
    if (!copyBtn) return;
    copyBtn.addEventListener("click", function () {
      var t = textForCopy(document.getElementById("ad-text"));
      var done = function () {
        copyBtn.textContent = "Copied";
        setTimeout(function () { copyBtn.textContent = "Copy"; }, 1600);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(t).then(done, done);
      } else {
        var ta = document.createElement("textarea");
        ta.value = t; document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); } catch (e) {}
        document.body.removeChild(ta); done();
      }
    });
  }

  function wireFeedbackCopyButton() {
    var copyBtn = document.getElementById("copy-fb");
    if (!copyBtn) return;
    copyBtn.addEventListener("click", function () {
      var t = textForCopy(document.getElementById("fb-text"));
      var done = function () {
        copyBtn.textContent = "Copied";
        setTimeout(function () { copyBtn.textContent = "Copy"; }, 1600);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(t).then(done, done);
      } else {
        var ta = document.createElement("textarea");
        ta.value = t; document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); } catch (e) {}
        document.body.removeChild(ta); done();
      }
    });
  }

  function render(data) {
    var html = "";
    if (data.error) {
      html += '<div class="error-box">' + esc(data.error) + "</div>";
    }
    html += sectionDashboard(data);
    html += sectionVehicle(data);
    html += sectionScrapers(data.scraper_status, data.cache_status);
    html += sectionMeta(data);
    html += sectionAd(data.ad_copy);
    html += sectionFeedbackCollapsible(data.feedback);
    html += sectionSaveDiscard(data);
    results.innerHTML = html;
    wireCopyButton();
    wireFeedbackToggle();
    wireFeedbackCopyButton();
    wireSaveDiscard();
  }

  function fetchCheck(stock) {
    return fetch("/check?stock=" + encodeURIComponent(stock))
      .then(function (r) { return r.json(); });
  }

  // -------------------------------------------------------------------- //
  // Auto-check on input — small "Ad on file" badge, 500ms debounce.
  // -------------------------------------------------------------------- //

  var badgeTimer = null;

  function clearBadge() {
    badgeEl.innerHTML = "";
  }

  function showBadge(stock, data) {
    // Stale-response guard: the input may have changed while the request
    // was in flight.
    if (input.value.trim() !== stock) return;
    if (data && data.found) {
      badgeEl.innerHTML = '<span class="badge-onfile">Ad on file — ' +
        esc(data.last_written || "date unknown") + "</span>";
    } else {
      clearBadge();
    }
  }

  input.addEventListener("input", function () {
    clearBadge();
    if (badgeTimer) { clearTimeout(badgeTimer); badgeTimer = null; }
    var stock = input.value.trim();
    if (!stock) return;
    badgeTimer = setTimeout(function () {
      console.log("[auto-check] fetching /check for:", stock);
      fetchCheck(stock)
        .then(function (j) {
          console.log("[auto-check] raw /check response:", j);
          showBadge(stock, j);
        })
        .catch(function (err) {
          console.error("[auto-check] error:", err);
          clearBadge();
        });
    }, 500);
  });

  function runGenerate(stock) {
    stock = (stock || "").trim();
    if (!stock) return;
    input.value = stock;
    clearBadge();

    btn.disabled = true;
    renderLoading();
    startWalk();

    var body = new URLSearchParams();
    body.set("stock_number", stock);

    fetch("/generate", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: body.toString()
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        stopWalk();
        var data = res.j || {};
        applyScraperSteps(data.scraper_status);
        finishAdStep(!!data.ad_copy && !data.error);
        // brief beat so the step states are visible before results swap in
        setTimeout(function () { render(data); }, 350);
      })
      .catch(function (err) {
        stopWalk();
        render({
          error: "Request failed: " + (err && err.message ? err.message : err),
          scraper_status: null, vehicle: null, ad_copy: null, feedback: null
        });
      })
      .finally(function () {
        btn.disabled = false;
      });
  }

  // Generate New Ad runs in a new tab (/?stock=X&generate=1) so the current
  // page stays put.
  function openGenerateTab(stock) {
    stock = (stock || "").trim().toUpperCase();
    if (!stock) return;
    window.open("/?stock=" + encodeURIComponent(stock) + "&generate=1", "_blank");
  }

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    openGenerateTab(input.value);
  });
  // /?stock=<STOCK> (linked from an Inventory row with no ad yet) pre-fills the box and
  // lets the existing lookup badge run. With &generate=1 (opened by
  // openGenerateTab) it starts the generation; the flag is then dropped from the
  // URL so a refresh doesn't generate again.
  (function () {
    var params = new URLSearchParams(window.location.search);
    var q = params.get("stock");
    if (!q) return;
    input.value = q.trim().toUpperCase();
    if (params.get("generate") === "1") {
      params.delete("generate");
      history.replaceState(null, "", window.location.pathname + "?" + params.toString());
      runGenerate(input.value);
      return;
    }
    input.dispatchEvent(new Event("input"));
    input.focus();
  })();
})();
</script>
{% endblock %}
