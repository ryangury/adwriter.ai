<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mercedes-Benz of Durham Ad Writer</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #1a1a1a;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #00263e;      /* MB deep navy */
    --fail: #b91c1c;
    --card: #f9fafb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  .wrap {
    max-width: 360px;
    margin: 96px auto 0;
    padding: 0 20px;
  }
  h1 {
    font-size: 1.25rem;
    font-weight: 650;
    margin: 0 0 4px;
    color: var(--accent);
  }
  p.sub {
    margin: 0 0 24px;
    color: var(--muted);
    font-size: 0.9rem;
  }
  form {
    display: flex;
    flex-direction: column;
    gap: 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px;
    background: var(--card);
  }
  label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    font-size: 1rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--text);
  }
  input[type="password"]:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  button {
    padding: 10px 22px;
    font-size: 1rem;
    font-weight: 600;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  .error {
    margin: 0;
    color: var(--fail);
    font-size: 0.85rem;
    font-weight: 500;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Mercedes-Benz of Durham Ad Writer</h1>
  <p class="sub">Enter the password to continue.</p>
  <form method="post" action="/auth" autocomplete="off">
    {% if error %}<p class="error">Incorrect password.</p>{% endif %}
    <div>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autofocus>
    </div>
    <button type="submit">Continue</button>
  </form>
</div>
</body>
</html>
